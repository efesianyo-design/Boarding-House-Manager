<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background Shield/Squircle with safe zone padding -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <!-- Outer Crest Accent Border -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="#334155" stroke-width="4"/>
  
  <!-- School / House Classical Pediment -->
  <path d="M 256 100 L 400 176 L 112 176 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="3"/>
  <rect x="128" y="184" width="256" height="16" rx="4" fill="#cbd5e1"/>
  
  <!-- Classical Pillars -->
  <rect x="144" y="208" width="28" height="136" rx="4" fill="#e2e8f0"/>
  <rect x="208" y="208" width="28" height="136" rx="4" fill="#e2e8f0"/>
  <rect x="276" y="208" width="28" height="136" rx="4" fill="#e2e8f0"/>
  <rect x="340" y="208" width="28" height="136" rx="4" fill="#e2e8f0"/>
  
  <!-- Foundation Base -->
  <rect x="116" y="348" width="280" height="20" rx="4" fill="#cbd5e1"/>
  
  <!-- Arrival / Departure Arrows Badge in Center -->
  <circle cx="256" cy="276" r="48" fill="#0f172a" stroke="url(#emeraldGrad)" stroke-width="6"/>
  <!-- Green checkmark & arrow -->
  <path d="M 236 276 L 250 290 L 280 256" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Brand ribbon banner bottom -->
  <rect x="96" y="396" width="320" height="44" rx="22" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="256" y="424" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#38bdf8" letter-spacing="2">SIR EUGENE TECH</text>
</svg>
